$kind: http-request
url: "{{Server}}/api/health"
method: GET
scripts:
  - type: afterResponse
    code: "//Validate Status 200\r

      pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      //Validate Response Body\r

      pm.test(\"Response has valid content type\", function () {\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"application/json\");\r

      });\r

      \r

      //Validate Response status = \"ok\"\r

      pm.test(\"Response body has status ok\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData.status).to.eql(\"ok\");\r

      });\r

      \r

      //Validate aiStatus\r

      pm.test(\"Response body indicates aiConfigured is true\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData.aiConfigured).to.be.true;\r

      });"
    language: text/javascript
