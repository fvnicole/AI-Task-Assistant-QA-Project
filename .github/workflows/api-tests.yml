name: API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-api-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Newman
      run: npm install -g newman

    - name: Run Newman tests
      run: newman run api/AITaskAssistantAPITesting.postman_collection.json -r json --reporter-json-export reporte.json

    - name: Upload report
      uses: actions/upload-artifact@v4
      with:
        name: newman-report
        path: reporte.json
